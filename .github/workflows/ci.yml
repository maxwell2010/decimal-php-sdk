name: SDK checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.2', '8.3', '8.4']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: curl, bcmath, gmp, mbstring
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit
      - run: composer test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/generate.py
      - run: git diff --exit-code -- src/Contracts docs/operations.json docs/abi-hashes.json
      - run: python tools/test_local_transports.py
      - run: python tools/release.py
